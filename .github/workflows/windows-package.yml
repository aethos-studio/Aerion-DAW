name: windows-package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke-tests:
    name: Windows MSVC build + smoke tests
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Show Visual Studio installations
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -products * -requires Microsoft.Component.MSBuild -property installationPath
          cmake --version

      - name: Pre-clone Tracktion Engine with HTTPS submodules
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.2.0 https://github.com/Tracktion/tracktion_engine.git tracktion_engine-src
          Push-Location tracktion_engine-src
          git submodule set-url modules/juce https://github.com/juce-framework/JUCE.git
          git submodule update --init --recursive --depth 1
          Pop-Location

      - name: Configure (Debug + tests)
        shell: pwsh
        run: >
          cmake -S AerionDawCpp -B build -G "Visual Studio 17 2022" -A x64
          -DAERION_BUILD_TESTS=ON
          -DFETCHCONTENT_SOURCE_DIR_TRACKTION_ENGINE="${{ github.workspace }}\tracktion_engine-src"

      - name: Build app
        shell: pwsh
        run: cmake --build build --config Debug --target AerionDaw --parallel

      - name: Build smoke tests
        shell: pwsh
        run: cmake --build build --config Debug --target AerionTests --parallel

      - name: Run smoke tests
        shell: pwsh
        run: ctest --test-dir build -C Debug -R "^AerionSmokeTests$" --output-on-failure --verbose

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerion-windows-smoke-test-logs
          path: build\Testing\Temporary\*.log
          if-no-files-found: ignore

  package:
    name: Windows Release app + NSIS installer
    runs-on: windows-2022
    needs: smoke-tests

    steps:
      - uses: actions/checkout@v4

      - name: Show Visual Studio installations
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -products * -requires Microsoft.Component.MSBuild -property installationPath
          cmake --version

      - name: Pre-clone Tracktion Engine with HTTPS submodules
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.2.0 https://github.com/Tracktion/tracktion_engine.git tracktion_engine-src
          Push-Location tracktion_engine-src
          git submodule set-url modules/juce https://github.com/juce-framework/JUCE.git
          git submodule update --init --recursive --depth 1
          Pop-Location

      - name: Configure (Release)
        shell: pwsh
        run: >
          cmake -S AerionDawCpp -B build -G "Visual Studio 17 2022" -A x64
          -DFETCHCONTENT_SOURCE_DIR_TRACKTION_ENGINE="${{ github.workspace }}\tracktion_engine-src"

      - name: Build app
        shell: pwsh
        run: cmake --build build --config Release --target AerionDaw --parallel

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package installer
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake -G NSIS -C Release -B dist

      - name: Locate installer
        id: find_installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "AerionDAW-*" -or $_.Name -like "Aerion DAW-*" } | Select-Object -First 1
          if (-not $installer) { Write-Error "No NSIS installer produced under dist/"; exit 1 }
          Write-Output "Installer: $($installer.FullName)"
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Release app artefact
        uses: actions/upload-artifact@v4
        with:
          name: aerion-windows-release-app
          path: build\AerionDaw_artefacts\Release\**
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: aerion-windows-installer
          path: ${{ steps.find_installer.outputs.path }}
          if-no-files-found: error
