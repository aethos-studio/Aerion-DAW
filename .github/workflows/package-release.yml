name: release-package

# Manual release packaging. Builds and (optionally) signs the Windows NSIS
# installer and the macOS DMG. Smoke tests live in their own workflow
# (build-test.yml); run those first if you want a pre-release check.
#
# Installers are named after the tag (v0.4.0-beta1 -> AerionDAW-0.4.0-beta1-*).
# Optional secrets:
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD   sign the Windows app and installer
#   APPLE_DEVELOPER_ID_P12_BASE64, APPLE_DEVELOPER_ID_P12_PASSWORD
#                                                    sign the macOS app and DMG (Developer ID)
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD      also notarize and staple the DMG
#   RELEASE_TOKEN                                    used instead of GITHUB_TOKEN to create the release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.4.0). Created automatically if it does not already exist.'
        required: true
      release_name:
        description: 'Release title (defaults to the tag name if left blank).'
        required: false
        default: ''
      draft:
        description: 'Create as a draft release (recommended - lets you review before publishing).'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a pre-release.'
        type: boolean
        default: true
      notes:
        description: 'Release notes (leave blank to auto-generate from merged PRs).'
        required: false
        default: ''
      platforms:
        description: 'Installers to build. Running again with the same tag adds them to that release.'
        type: choice
        options: [both, windows, macos]
        default: both

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows installer (NSIS)
    if: ${{ inputs.platforms != 'macos' }}
    runs-on: windows-latest

    # Self-signed code signing is optional: when both secrets are present the
    # app + installer are signed and timestamped, otherwise signing is skipped
    # and the unsigned installer is still produced. Generate the secrets with
    # AerionDawCpp/Tools/New-AerionSelfSignedCert.ps1.
    env:
      CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pre-clone Tracktion Engine with HTTPS submodules
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.2.0 https://github.com/Tracktion/tracktion_engine.git tracktion_engine-src
          Push-Location tracktion_engine-src
          git submodule set-url modules/juce https://github.com/juce-framework/JUCE.git
          git submodule update --init --recursive --depth 1
          Pop-Location

      - name: Configure (Release)
        shell: pwsh
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: >
          cmake -S AerionDawCpp -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAERION_PACKAGE_VERSION="$($env:TAG_NAME -replace '^[vV]', '')"
          -DFETCHCONTENT_SOURCE_DIR_TRACKTION_ENGINE="${{ github.workspace }}\tracktion_engine-src"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --target AerionDaw --parallel

      # Sign the built executable in place before CPack packages it, so the exe
      # inside the installer is signed too. CPack copies the artefact as-is.
      - name: Sign application (self-signed)
        if: ${{ env.CERT_B64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "aerion-codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfx, [System.Convert]::FromBase64String($env:CERT_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { Write-Error "signtool.exe not found on runner"; exit 1 }
          $exe = (Get-ChildItem -Path build\AerionDaw_artefacts -Recurse -Filter "Aerion DAW.exe" | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "Built 'Aerion DAW.exe' not found"; exit 1 }
          & $signtool sign /f $pfx /p $env:CERT_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$exe"
          & $signtool verify /pa "$exe"

      - name: Install NSIS (for CPack)
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package (NSIS installer)
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake -G NSIS -C Release -B dist

      - name: Locate installer
        id: find_installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "AerionDAW-*" -or $_.Name -like "Aerion DAW-*" } | Select-Object -First 1
          if (-not $installer) { Write-Error "No NSIS installer produced under dist/"; exit 1 }
          Write-Output "Installer: $($installer.FullName)"
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign installer (self-signed)
        if: ${{ env.CERT_B64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "aerion-codesign.pfx"
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f $pfx /p $env:CERT_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ steps.find_installer.outputs.path }}"
          & $signtool verify /pa "${{ steps.find_installer.outputs.path }}"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: aerion-windows-installer
          path: ${{ steps.find_installer.outputs.path }}
          if-no-files-found: error

  macos-installer:
    name: macOS installer (DMG)
    if: ${{ inputs.platforms != 'windows' }}
    runs-on: macos-latest

    # Developer ID signing and notarization are optional, like Windows
    # signing: without the secrets the DMG is built with ad-hoc signatures,
    # which Gatekeeper only opens after right-click > Open.
    env:
      MACOS_CERT_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      MACOS_CERT_PW: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Pre-clone Tracktion Engine with HTTPS submodules
        run: |
          git clone --depth 1 --branch v3.2.0 https://github.com/Tracktion/tracktion_engine.git tracktion_engine-src
          cd tracktion_engine-src
          git submodule set-url modules/juce https://github.com/juce-framework/JUCE.git
          git submodule update --init --recursive --depth 1

      - name: Configure (Release, universal)
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: >
          cmake -S AerionDawCpp -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAERION_PACKAGE_VERSION="${TAG_NAME#[vV]}"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DAERION_ENABLE_ASIO=NEVER
          -DFETCHCONTENT_SOURCE_DIR_TRACKTION_ENGINE="$GITHUB_WORKSPACE/tracktion_engine-src"

      - name: Build (Release)
        run: cmake --build build --target AerionDaw --parallel

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERT_B64 != '' }}
        run: |
          keychain="$RUNNER_TEMP/aerion-signing.keychain-db"
          keychain_pw="$(uuidgen)"
          echo "$MACOS_CERT_B64" | base64 --decode > "$RUNNER_TEMP/aerion-devid.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/aerion-devid.p12" -k "$keychain" -P "$MACOS_CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$identity" ]; then
            echo "No 'Developer ID Application' identity in the certificate" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # Replaces the build's ad-hoc signature, so the bundle CPack copies into
      # the DMG is signed with the hardened runtime notarization requires.
      - name: Sign application (Developer ID)
        if: ${{ env.SIGN_IDENTITY != '' }}
        run: |
          app=$(find build -maxdepth 4 -name "Aerion DAW.app" -type d | head -n 1)
          if [ -z "$app" ]; then
            echo "Built 'Aerion DAW.app' not found" >&2
            exit 1
          fi
          codesign --force --deep --options runtime --timestamp \
            --entitlements AerionDawCpp/Packaging/macOS/AerionDaw.entitlements \
            --sign "$SIGN_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

      - name: Package (DMG)
        run: cpack --config build/CPackConfig.cmake -G DragNDrop -C Release -B dist

      - name: Locate DMG
        id: find_dmg
        run: |
          dmg=$(find dist -name "*.dmg" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "No DMG produced under dist/" >&2
            exit 1
          fi
          echo "DMG: $dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Sign DMG
        env:
          DMG: ${{ steps.find_dmg.outputs.path }}
        run: |
          if [ -n "$SIGN_IDENTITY" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          else
            codesign --force --sign - "$DMG"
          fi
          codesign --verify --verbose=2 "$DMG"

      - name: Notarize and staple DMG
        if: ${{ env.SIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        env:
          DMG: ${{ steps.find_dmg.outputs.path }}
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Remove signing keychain
        if: ${{ always() && env.SIGN_KEYCHAIN != '' }}
        run: security delete-keychain "$SIGN_KEYCHAIN" || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: aerion-macos-dmg
          path: ${{ steps.find_dmg.outputs.path }}
          if-no-files-found: error

  # Publishes whichever installers built, so a failed or skipped platform does
  # not hold back the other. The failed job still marks the run as failed.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [windows-installer, macos-installer]
    if: >-
      ${{ !cancelled() && (needs.windows-installer.result == 'success'
                           || needs.macos-installer.result == 'success') }}
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        if: ${{ needs.windows-installer.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: aerion-windows-installer
          path: dist/windows

      - name: Download macOS DMG
        if: ${{ needs.macos-installer.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: aerion-macos-dmg
          path: dist/macos

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          NOTES: ${{ inputs.notes }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          shopt -s nullglob
          files=(dist/windows/* dist/macos/*)
          repo="${{ github.repository }}"

          explain_failure() {
            echo "::error::Could not $1 the release for $TAG_NAME. If the error above is" \
                 "'HTTP 403: Resource not accessible by integration', GitHub refused GITHUB_TOKEN" \
                 "although this job asks for contents: write. Add a RELEASE_TOKEN secret (a" \
                 "fine-grained token with Contents: read and write on this repository); this step" \
                 "then uses it instead. The installers are attached to this run as artifacts."
            exit 1
          }

          # A release for this tag already exists, drafts included (e.g. the
          # other platform was built in an earlier run): add or replace the
          # installers there.
          if gh release view "$TAG_NAME" --repo "$repo" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber --repo "$repo" || explain_failure update
            exit 0
          fi

          title="${RELEASE_NAME:-$TAG_NAME}"
          args=(--title "$title" --target "${{ github.sha }}")
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ -n "$NOTES" ]; then
            args+=(--notes "$NOTES")
          else
            args+=(--generate-notes)
          fi
          gh release create "$TAG_NAME" "${files[@]}" "${args[@]}" --repo "$repo" || explain_failure create
