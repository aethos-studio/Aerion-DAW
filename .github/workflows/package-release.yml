name: release-package

# Manual release packaging. Builds and (optionally) signs the Windows NSIS
# installer and the macOS DMG. Smoke tests live in their own workflow
# (build-test.yml); run those first if you want a pre-release check.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows installer (NSIS)
    runs-on: windows-latest

    # Self-signed code signing is optional: when both secrets are present the
    # app + installer are signed and timestamped, otherwise signing is skipped
    # and the unsigned installer is still produced. Generate the secrets with
    # AerionDawCpp/Tools/New-AerionSelfSignedCert.ps1.
    env:
      CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      CERT_PW: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Pre-clone Tracktion Engine with HTTPS submodules
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.2.0 https://github.com/Tracktion/tracktion_engine.git tracktion_engine-src
          Push-Location tracktion_engine-src
          git submodule set-url modules/juce https://github.com/juce-framework/JUCE.git
          git submodule update --init --recursive --depth 1
          Pop-Location

      - name: Configure (Release)
        shell: pwsh
        run: >
          cmake -S AerionDawCpp -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_SOURCE_DIR_TRACKTION_ENGINE="${{ github.workspace }}\tracktion_engine-src"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --target AerionDaw --parallel

      # Sign the built executable in place before CPack packages it, so the exe
      # inside the installer is signed too. CPack copies the artefact as-is.
      - name: Sign application (self-signed)
        if: ${{ env.CERT_B64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "aerion-codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfx, [System.Convert]::FromBase64String($env:CERT_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { Write-Error "signtool.exe not found on runner"; exit 1 }
          $exe = (Get-ChildItem -Path build\AerionDaw_artefacts -Recurse -Filter "Aerion DAW.exe" | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "Built 'Aerion DAW.exe' not found"; exit 1 }
          & $signtool sign /f $pfx /p $env:CERT_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "$exe"
          & $signtool verify /pa "$exe"

      - name: Install NSIS (for CPack)
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package (NSIS installer)
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake -G NSIS -C Release -B dist

      - name: Locate installer
        id: find_installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "AerionDAW-*" -or $_.Name -like "Aerion DAW-*" } | Select-Object -First 1
          if (-not $installer) { Write-Error "No NSIS installer produced under dist/"; exit 1 }
          Write-Output "Installer: $($installer.FullName)"
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign installer (self-signed)
        if: ${{ env.CERT_B64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "aerion-codesign.pfx"
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f $pfx /p $env:CERT_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ steps.find_installer.outputs.path }}"
          & $signtool verify /pa "${{ steps.find_installer.outputs.path }}"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: aerion-windows-installer
          path: ${{ steps.find_installer.outputs.path }}
          if-no-files-found: error

  macos-installer:
    name: macOS installer (DMG)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Pre-clone Tracktion Engine with HTTPS submodules
        run: |
          git clone --depth 1 --branch v3.2.0 https://github.com/Tracktion/tracktion_engine.git tracktion_engine-src
          cd tracktion_engine-src
          git submodule set-url modules/juce https://github.com/juce-framework/JUCE.git
          git submodule update --init --recursive --depth 1

      - name: Configure (Release, universal)
        run: >
          cmake -S AerionDawCpp -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DAERION_ENABLE_ASIO=NEVER
          -DFETCHCONTENT_SOURCE_DIR_TRACKTION_ENGINE="$GITHUB_WORKSPACE/tracktion_engine-src"

      - name: Build (Release)
        run: cmake --build build --target AerionDaw --parallel

      - name: Package (DMG)
        run: cpack --config build/CPackConfig.cmake -G DragNDrop -C Release -B dist

      - name: Locate DMG
        id: find_dmg
        run: |
          dmg=$(find dist -name "*.dmg" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "No DMG produced under dist/" >&2
            exit 1
          fi
          echo "DMG: $dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: aerion-macos-dmg
          path: ${{ steps.find_dmg.outputs.path }}
          if-no-files-found: error
